[project]
name = "sign-language-detector-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
   "accelerate>=1.13.0",
   "av>=16.0.1",
   "bitsandbytes>=0.49.2",
   "datasets>=4.4.1",
   "decord>=0.6.0",
   "fastapi>=0.128.0",
   "huggingface-hub>=0.36.0",
   "imageio>=2.37.2",
   "imageio-ffmpeg>=0.6.0",
   "mediapipe>=0.10.31",
   "numpy>=2.2.6",
   "openai>=2.30.0",
   "opencv-python>=4.12.0.88",
   "peft>=0.18.0",
   "pillow>=12.0.0",
   "pydantic>=2.12.5",
   "python-dotenv>=1.2.1",
   "python-multipart>=0.0.21",
   "pytorchvideo>=0.1.5",
   "pyyaml>=6.0.3",
   "scikit-learn>=1.7.2",
   "streamlit>=1.52.1",
   "streamlit-webrtc>=0.64.5",
   "tensorboard>=2.20.0",
   "transformers>=5.3.0",
   "trl>=0.25.1",
   "uvicorn[standard]>=0.40.0",
   "websockets>=15.0.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
